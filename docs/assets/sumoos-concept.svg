 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#192439"/></linearGradient>
 <radialGradient id="floor"><stop stop-color="#28364c"/><stop offset="1" stop-color="#101928"/></radialGradient>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6ee7ce"/></marker>
</defs>
