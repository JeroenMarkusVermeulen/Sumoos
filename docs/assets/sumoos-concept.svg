<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Sumoos: autonomy meets human control</title>
<desc id="desc">Concept illustration of a cyan autonomous sumobot facing a purple Arduino-controlled sumobot in a marked ring. The goal is to push the opponent out.</desc>
