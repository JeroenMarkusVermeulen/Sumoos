<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Sumoos system architecture</title>
<desc id="desc">Arduino input goes over USB to the .NET gateway on a laptop, then by MQTT to a Docker Mosquitto broker on the same laptop. A local Wi-Fi link connects the broker to an ESP32, which sends UART commands to the manual Zumo. The autonomous Zumo uses onboard sensors, decisions and motors locally. Both robots require local boundary protection and a command-loss stop where applicable. The website is separate.</desc>
