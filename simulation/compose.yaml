name: sumoos-simulation
services:
  broker:
    image: eclipse-mosquitto:2.0.23
    ports: ["127.0.0.1:1884:1883"]
    environment:
      SIM_MQTT_USERNAME: ${SIM_MQTT_USERNAME:-sumoos}
      SIM_MQTT_PASSWORD: ${SIM_MQTT_PASSWORD:?Set SIM_MQTT_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mosquitto_passwd -b -c /tmp/passwords "$$SIM_MQTT_USERNAME" "$$SIM_MQTT_PASSWORD"
        chmod 644 /tmp/passwords
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes: ["./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  robot:
    build: ./robot
    depends_on: [broker]
    environment:
      BROKER_HOST: broker
      ROBOT_ID: bot-2
      SIM_MQTT_USERNAME: ${SIM_MQTT_USERNAME:-sumoos}
      SIM_MQTT_PASSWORD: ${SIM_MQTT_PASSWORD:?Set SIM_MQTT_PASSWORD in .env}
